name: Fedora RPM

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fedora-rpm
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/filip-rs/libfprint.git

jobs:
  check:
    name: Check elanpress
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.upstream.outputs.build }}
      commit: ${{ steps.upstream.outputs.commit }}
      short: ${{ steps.upstream.outputs.short }}
      stamp: ${{ steps.upstream.outputs.stamp }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: Compare with the last built commit
        id: upstream
        run: |
          set -euo pipefail
          git clone --depth 1 --branch elanpress "$UPSTREAM" upstream
          sha=$(git -C upstream rev-parse HEAD)
          short=$(git -C upstream rev-parse --short=7 HEAD)
          committed=$(git -C upstream log -1 --format=%ct)
          stamp=$(date -u -d "@${committed}" +%Y%m%d%H%M%S)
          version=$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" upstream/meson.build | head -1)
          test -n "$version"
          last=""
          http=$(curl -sS -o built-commit -w '%{http_code}' \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/repo/built-commit" || true)
          if [ "$http" = "200" ]; then
            last=$(tr -d '[:space:]' < built-commit)
          fi
          echo "upstream ${sha}"
          echo "last     ${last:-<none>}"
          echo "version  ${version}"
          echo "release  1.${stamp}git${short}"
          build=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$sha" = "$last" ]; then
            build=false
            echo "elanpress is unchanged; skipping the RPM build"
          fi
          {
            echo "build=${build}"
            echo "commit=${sha}"
            echo "short=${short}"
            echo "stamp=${stamp}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  rpm:
    name: Build on Fedora 44
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    defaults:
      run:
        shell: bash
    env:
      ELANPRESS_COMMIT: ${{ needs.check.outputs.commit }}
      ELANPRESS_STAMP: ${{ needs.check.outputs.stamp }}
      ELANPRESS_SHORT: ${{ needs.check.outputs.short }}
      ELANPRESS_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install git
        run: dnf install -y git

      - name: Checkout packaging
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          dnf install -y rpm-build redhat-rpm-config \
            meson ninja-build gcc gcc-c++ pkgconf-pkg-config \
            glib2-devel libgusb-devel pixman-devel nss-devel cairo-devel \
            libgudev-devel gobject-introspection-devel systemd systemd-devel \
            openssl-devel python3

      - name: Archive upstream commit
        run: |
          git clone --filter=blob:none "$UPSTREAM" upstream
          git -C upstream checkout "$ELANPRESS_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$ELANPRESS_COMMIT"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          git -C upstream archive --format=tar.gz \
            --prefix="libfprint-${ELANPRESS_VERSION}/" \
            -o "$HOME/rpmbuild/SOURCES/libfprint-${ELANPRESS_VERSION}.tar.gz" HEAD

      - name: Build RPM
        run: |
          rpmbuild -bb libfprint.spec \
            --define "elanpress_version ${ELANPRESS_VERSION}" \
            --define "elanpress_commit ${ELANPRESS_COMMIT}" \
            --define "elanpress_stamp ${ELANPRESS_STAMP}" \
            --define "elanpress_short ${ELANPRESS_SHORT}"

      - name: Check the package
        run: |
          shopt -s nullglob
          rpm=( "$HOME"/rpmbuild/RPMS/x86_64/libfprint-[0-9]*.x86_64.rpm )
          test "${#rpm[@]}" -eq 1
          evr=$(rpm -qp --queryformat '%{EPOCH}:%{NAME}-%{VERSION}-%{RELEASE}' "${rpm[0]}")
          echo "$evr"
          expected="1:libfprint-${ELANPRESS_VERSION}-2.${ELANPRESS_STAMP}git${ELANPRESS_SHORT}"
          case "$evr" in
            "$expected"*) ;;
            *) echo "unexpected EVR: $evr" >&2; exit 1 ;;
          esac
          changelog=$(mktemp)
          if ! rpm -qp --changelog "${rpm[0]}" > "$changelog"; then
            echo "cannot read changelog" >&2
            exit 1
          fi
          if grep -q '@' "$changelog"; then
            echo "changelog must not contain an email address" >&2
            exit 1
          fi
          rm -f "$changelog"
          work=$(mktemp -d)
          rpm2cpio "${rpm[0]}" | (cd "$work" && cpio -idmv)
          grep -a -q elanpress "$work/usr/lib64/libfprint-2.so.2.0.0"
          test -f "$work/usr/lib/udev/rules.d/70-libfprint-2.rules"
          test -f "$work/usr/lib/udev/hwdb.d/60-autosuspend-libfprint-2.hwdb"
          mkdir -p dist
          cp "${rpm[0]}" dist/libfprint-elanpress.fc44.x86_64.rpm
          cp "${rpm[0]}" "dist/$(basename "${rpm[0]}")"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: libfprint-elanpress-fc44
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish release and dnf repository
    needs: [check, rpm]
    if: needs.check.outputs.build == 'true' && needs.rpm.result == 'success'
    runs-on: ubuntu-latest
    env:
      ELANPRESS_COMMIT: ${{ needs.check.outputs.commit }}
      ELANPRESS_SHORT: ${{ needs.check.outputs.short }}
    steps:
      - name: Download RPM
        uses: actions/download-artifact@v8
        with:
          name: libfprint-elanpress-fc44
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          tag=fc44
          notes=$(cat <<EOF
          Fedora 44 x86_64 builds of [filip-rs/libfprint](https://github.com/filip-rs/libfprint) \`elanpress\`.

          Latest commit: \`${ELANPRESS_COMMIT}\`.

          Older RPMs stay attached to this release and in the dnf repository, so \`dnf downgrade libfprint\` can select one. Install, upgrade, downgrade, and the return to Fedora's package are described in the repository README.
          EOF
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p old-assets
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir old-assets --pattern '*.rpm' || true
            shopt -s nullglob
            for asset in old-assets/*.rpm; do
              changelog=$(mktemp)
              if ! rpm -qp --changelog "$asset" > "$changelog"; then
                echo "cannot read changelog of $(basename "$asset")" >&2
                exit 1
              fi
              if grep -q '@' "$changelog"; then
                gh release delete-asset "$tag" "$(basename "$asset")" --repo "$GITHUB_REPOSITORY" --yes
              fi
              rm -f "$changelog"
            done
            gh release upload "$tag" dist/*.rpm --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Fedora 44 (${ELANPRESS_SHORT})" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" dist/*.rpm \
              --repo "$GITHUB_REPOSITORY" \
              --title "Fedora 44 (${ELANPRESS_SHORT})" \
              --notes "$notes" \
              --latest
          fi

      - name: Publish dnf repository branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c rpm
          rm -rf repo-publish
          mkdir -p repo-publish/44/x86_64
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo-git
          cd repo-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin repo; then
            git checkout repo
            shopt -s nullglob
            for asset in 44/x86_64/*.rpm; do
              changelog=$(mktemp)
              if ! rpm -qp --changelog "$asset" > "$changelog"; then
                echo "cannot read changelog of $(basename "$asset")" >&2
                exit 1
              fi
              if grep -q '@' "$changelog"; then
                echo "dropping $(basename "$asset")"
                rm -f "$changelog"
                continue
              fi
              rm -f "$changelog"
              cp "$asset" ../repo-publish/44/x86_64/
            done
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          else
            git checkout --orphan repo
            git rm -rf . || true
          fi
          cp ../dist/libfprint-[0-9]*.rpm ../repo-publish/44/x86_64/
          createrepo_c ../repo-publish/44/x86_64
          printf '%s\n' "$ELANPRESS_COMMIT" > ../repo-publish/built-commit
          cp -a ../repo-publish/. .
          git add -A
          if git diff --cached --quiet; then
            echo "repository metadata unchanged"
            exit 0
          fi
          git commit -m "Update Fedora 44 libfprint elanpress repository"
          git push origin HEAD:repo
